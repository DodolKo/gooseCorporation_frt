<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Re-entrée GooseCorp</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
        .notifications { position: fixed; top: 20px; right: 20px; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Re-entrée GooseCorp</h1>
        
        <form id="reentryForm">
            <div class="form-group">
                <label for="visitorId">ID de Badge:</label>
                <input type="text" id="visitorId" name="visitorId" value="cmd2sug8m0001ntyq54abk5zx" required>
            </div>
            
            <div class="form-group">
                <label for="visitReason">Raison de la visite:</label>
                <select id="visitReason" name="visitReason" required>
                    <option value="">Sélectionner...</option>
                    <option value="MEETING">Meeting</option>
                    <option value="FORMATION">Formation</option>
                    <option value="OTHER">Autre</option>
                    <option value="DELIVERY">Livraison</option>
                    <option value="MAINTENANCE">Maintenance</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="staffId">Staff ID (optionnel):</label>
                <input type="number" id="staffId" name="staffId">
            </div>
            
            <div class="form-group">
                <label for="formationId">Formation ID (optionnel):</label>
                <input type="number" id="formationId" name="formationId">
            </div>
            
            <button type="submit">Tester Re-entrée</button>
        </form>
        
        <div id="result"></div>
    </div>

    <div id="notifications" class="notifications"></div>

    <script src="src/api.js"></script>
    <script src="src/utils.js"></script>
    <script>
        function showResult(title, success, data) {
            const div = document.createElement('div');
            div.className = `result ${success ? 'success' : 'error'}`;
            div.innerHTML = `<h3>${title}</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
            document.getElementById('result').innerHTML = '';
            document.getElementById('result').appendChild(div);
        }

        document.getElementById('reentryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const reentryData = {
                visitorId: formData.get('visitorId').trim(),
                visitReason: formData.get('visitReason'),
                staffId: formData.get('staffId') || undefined,
                formationId: formData.get('formationId') || undefined
            };

            console.log('🧪 Test re-entrée avec:', reentryData);

            try {
                const result = await VisitorService.reenterVisitor(reentryData);
                showResult('✅ Re-entrée réussie', true, result);
                
                // Initialiser les notifications si nécessaire
                if (!window.notificationSystem) {
                    window.notificationSystem = new NotificationSystem();
                }
                window.notificationSystem.success('Re-entrée réussie !');
                
            } catch (error) {
                console.error('❌ Erreur re-entrée:', error);
                showResult('❌ Erreur re-entrée', false, { error: error.message });
                
                // Initialiser les notifications si nécessaire
                if (!window.notificationSystem) {
                    window.notificationSystem = new NotificationSystem();
                }
                window.notificationSystem.error('Erreur: ' + error.message);
            }
        });

        // Auto-test au chargement
        window.onload = function() {
            console.log('API_CONFIG.DEMO_MODE:', API_CONFIG.DEMO_MODE);
            console.log('API_CONFIG.BASE_URL:', API_CONFIG.BASE_URL);
        };
    </script>
</body>
</html>
